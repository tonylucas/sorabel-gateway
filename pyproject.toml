[project]
name = "sorabel-gateway"
version = "0.1.0"
description = "Sorabel Data Gateway — point d'accès unique aux données Sorabel (corpus documentaire + base SQL) via un serveur MCP"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "chromadb>=0.5,<0.6",
    "mcp>=1.2,<2",
    "pypdf>=4.2,<6",
    "beautifulsoup4>=4.12,<5",
    "rank-bm25>=0.2,<0.3",
    "fastembed>=0.8.0",
    "sqlglot>=25,<30",
    "google-genai>=1.0,<2",
    "pyyaml>=6,<7",
    "psycopg[binary,pool]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.30",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*", "retrieval*", "sql*", "gateway*", "mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

# La suite d'acceptance et le seed sont fournis et font spécification : les
# reformater brouillerait le diff de ce qui fait foi. Ruff les analyse encore
# (`ruff check`), il ne les réécrit plus.
[tool.ruff.format]
exclude = ["tests/acceptance/*", "tests/conftest.py", "scripts/seed.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# `scripts/seed.py` est fourni et fait référence : il génère la base sur
# laquelle `tests/conftest.py` calcule ses attendus. Ruff ne le reformate déjà
# plus ; mypy ne l'annote pas davantage, pour la même raison.
[[tool.mypy.overrides]]
module = "scripts.seed"
ignore_errors = true
