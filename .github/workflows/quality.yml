name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # `tests/test_roles.py` ouvre une vraie connexion par rôle : la barrière 1
    # d'E3 ne se vérifie que dans une base. Même version majeure que le serveur
    # Azure, pour qu'un dialecte qui passe ici passe là-bas.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sorabel
          POSTGRES_PASSWORD: sorabel
          POSTGRES_DB: sorabel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorabel"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: sorabel
      PGUSER: sorabel
      PGPASSWORD: sorabel
      # Mots de passe des rôles : la CI part d'une base neuve à chaque
      # exécution, ils n'ont rien à protéger.
      PG_SUPPORT: ci_support
      PG_COMMERCIAL: ci_commercial
      PG_DEV: ci_dev
      PG_CATALOG: ci_catalog

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync
      - name: Seed
        run: uv run python scripts/seed.py
      - name: Migrate
        run: uv run python -m scripts.migrate
      - name: Roles
        run: uv run python -m scripts.roles
      - name: Ingest
        run: uv run python -m ingest.index

      - name: Lint
        run: uv run ruff check .
      - name: Acceptance
        run: uv run pytest -q
        env:
          # `ask_database` génère son SQL avec Gemini : sans cette clé, les
          # quatre tests d'acceptance SQL échouent. À renseigner dans
          # Settings → Secrets and variables → Actions.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Le free tier répond entre 1 s et 30 s : le budget par appel de la
          # suite est relevé sur un runner partagé.
          GATEWAY_TEST_TIMEOUT: "60"
